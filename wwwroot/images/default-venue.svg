<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="150" cy="100" r="180" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="700" cy="400" r="220" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Glass Card Overlay -->
  <rect x="150" y="80" width="500" height="340" rx="24" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Venue Icon Graphic -->
  <g transform="translate(400, 220)" text-anchor="middle">
    <!-- Building Symbol -->
    <path d="M-50,-40 L0,-70 L50,-40 L50,60 L-50,60 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-25,-10 L-10,-10 L-10,10 L-25,10 Z" fill="#ffffff" fill-opacity="0.8" />
    <path d="M10,-10 L25,-10 L25,10 L10,10 Z" fill="#ffffff" fill-opacity="0.8" />
    <path d="M-12,25 L12,25 L12,60 L-12,60 Z" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="0" cy="-35" r="8" fill="#ffffff" />
    <!-- Stars -->
    <path d="M-90,-20 L-85,-5 L-70,-5 L-82,5 L-77,20 L-90,10 L-103,20 L-98,5 L-110,-5 L-95,-5 Z" fill="#f59e0b" transform="scale(0.5)" />
    <path d="M90,-20 L95,-5 L110,-5 L98,5 L103,20 L90,10 L77,20 L82,5 L70,-5 L85,-5 Z" fill="#f59e0b" transform="scale(0.5)" />
  </g>
  
  <text x="400" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">EVENT EASE VENUE</text>
  <text x="400" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#e0e7ff" text-anchor="middle">Premium Space &amp; Conference Hall</text>
</svg>
